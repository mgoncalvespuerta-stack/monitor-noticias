# Publica el monitor en GitHub Pages y renueva las noticias cada 30 minutos.
name: Actualizar y publicar monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada 30 minutos
    - cron: "0,30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Recuperar la última copia publicada (por si los medios no responden)
        continue-on-error: true
        run: |
          curl -fsSL --max-time 30 "${{ steps.pages.outputs.base_url }}/data/respaldo.json" -o /tmp/publicado.json
          python3 -c "import json; d=json.load(open('/tmp/publicado.json')); assert len(d['noticias']) > 8"
          cp /tmp/publicado.json data/respaldo.json

      - name: Instalar el cliente de la API de Claude (para el tono de las menciones)
        run: pip install --quiet anthropic

      - name: Descargar noticias
        env:
          # Clave guardada en Settings → Secrets and variables → Actions. Sin ella no se analiza el tono.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 server.py --respaldo

      - name: Preparar sitio
        run: |
          mkdir -p _site/data
          cp index.html styles.css script.js _site/
          # Cada versión publicada lleva su propio número, para que los navegadores
          # no sigan usando estilos o código viejos guardados en memoria
          sed -i "s/?v=local/?v=${GITHUB_SHA::7}/g" _site/index.html
          cp data/respaldo.json data/medios.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
